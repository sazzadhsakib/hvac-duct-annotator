[project]
name = "hvac-duct-annotator"
version = "0.1.0"
description = "Detect, size, measure and annotate ductwork in HVAC mechanical drawing PDFs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pymupdf>=1.24",
    "rapidocr-onnxruntime>=1.4",
]

[project.scripts]
ductmark = "ductmark.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ductmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs OCR over the sample drawing"]
